name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Tag to release (e.g. v1.2.0)'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      tag-version: ${{ steps.tag-version.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-infra:
    name: Build infra
    runs-on: ubuntu-24.04
    environment: Prod
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Package application
        run: |
          cd infra
          mvn clean package

      - name: Synth CloudFormation templates
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
          MIGRATION_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-migration:${{ needs.prepare.outputs.tag-version }}
          API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:${{ needs.prepare.outputs.tag-version }}
          API_DDL_USER: ${{ secrets.API_DDL_USER }}
          API_DML_USER: ${{ secrets.API_DML_USER }}
          JWT_ISSUER_URI: ${{ vars.JWT_ISSUER_URI }}
        run: |
          cd infra
          java -jar target/infra-1.0-SNAPSHOT.jar

      - name: Upload CloudFormation templates
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: infra/cdk.out

  build-migration:
    name: Build migration
    runs-on: ubuntu-24.04
    environment: Prod
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push migration image to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-migration:${{ needs.prepare.outputs.tag-version }}, ${{ secrets.DOCKERHUB_USERNAME }}/bsn-migration:latest

  build-api:
    name: Build api
    runs-on: ubuntu-24.04
    environment: Prod
    needs: prepare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push api image to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:${{ needs.prepare.outputs.tag-version }}, ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:latest

  build-web:
    runs-on: ubuntu-24.04
    name: Build web
    environment: Prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Node dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build application
        env:
          API_URL: ${{ vars.API_URL }}
          KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT: ${{ vars.KEYCLOAK_CLIENT }}
        run: |
          cd apps/web
          envsubst < config/environment-cloud.json > src/assets/environment.json
          npm run build -- --base-href /bsn/

      - name: Upload web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist
          path: apps/web/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: [build-infra, build-migration, build-api, build-web]
    environment: Prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download CloudFormation templates
        uses: actions/download-artifact@v8
        with:
          name: cdk-out
          path: infra/cdk.out

      - name: Download web app artifact
        uses: actions/download-artifact@v8
        with:
          name: web-app-dist
          path: apps/web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy BsnMigration stack
        run: |
          aws cloudformation deploy \
            --stack-name BsnMigration \
            --template-file infra/cdk.out/BsnMigration.template.json \
            --capabilities CAPABILITY_IAM

      - name: Run migration task
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
        run: |
          set -eu

          PRIVATE_SUBNET_1_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/vpc/private-subnet-1-id" \
            --query "Parameter.Value" \
            --output text)

          PRIVATE_SUBNET_2_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/vpc/private-subnet-2-id" \
            --query "Parameter.Value" \
            --output text)

          ECS_SG_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/vpc/ecs-sg-id" \
            --query "Parameter.Value" \
            --output text)

          ECS_CLUSTER_NAME=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/ecs/cluster-name" \
            --query "Parameter.Value" \
            --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER_NAME" \
            --launch-type FARGATE \
            --task-definition bsn-migration \
            --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET_1_ID,$PRIVATE_SUBNET_2_ID],securityGroups=[$ECS_SG_ID],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Started ECS task: $TASK_ARN"
          echo "Waiting for ECS task to stop..."

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          echo "ECS task stopped"
          echo "Stopped reason: $STOPPED_REASON"
          echo "Exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            exit 1
          fi

      - name: Deploy BsnService stack
        run: |
          aws cloudformation deploy \
            --stack-name BsnService \
            --template-file infra/cdk.out/BsnService.template.json \
            --capabilities CAPABILITY_IAM

      - name: Upload web app assets to S3
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
        run: |
          set -eu

          S3_BUCKET_NAME=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/s3/bucket-name" \
            --query "Parameter.Value" \
            --output text)

          aws s3 sync apps/web/dist/web/browser s3://$S3_BUCKET_NAME/bsn --delete

      - name: Invalidate CloudFront distribution
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
        run: |
          set -eu

          CF_DISTRIBUTION_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/cf/distribution-id" \
            --query "Parameter.Value" \
            --output text)

          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID \
            --paths "/bsn" "/bsn/*"
